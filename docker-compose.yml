version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: table_tomato_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tabletomato
      POSTGRES_PASSWORD: tabletomato
      POSTGRES_DB: table_tomato
    ports:
      - "5432:5432"
    volumes:
      - table_tomato_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletomato -d table_tomato"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: table_tomato_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - table_tomato_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  table_tomato_pg_data:
  table_tomato_redis_data:
